apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    alerting:
      alertmanagers:
         - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/alert-rules.yaml

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'jenkins'
        metrics_path: /prometheus
        static_configs:
          - targets: ['jenkins:8080']

      - job_name: 'loki'
        static_configs:
          - targets: ['loki:3100']

      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy:12345']

      - job_name: 'demo-app'
        static_configs:
          - targets: ['demo-app:9113']
